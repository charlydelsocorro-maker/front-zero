#hud [data-h="map"]{left:18px;top:18px;width:170px;height:170px;background:rgba(10,12,8,.65);border:1px solid var(--line)}

#hud [data-h="feed"]{right:18px;top:18px;text-align:right;font-size:19px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:44vw}

#hud [data-h="msg"]{left:50%;top:27%;transform:translateX(-50%);font-size:30px;font-weight:800;color:var(--amber);letter-spacing:.08em;white-space:nowrap}
#hud [data-h="prompt"]{left:50%;top:60%;transform:translateX(-50%);font-size:21px;color:#fff;background:rgba(10,12,8,.7);border:1px solid var(--line);padding:4px 16px;white-space:nowrap}

#hud [data-h="fps"]{left:50%;top:92px;transform:translateX(-50%);font-size:16px;color:var(--green);background:rgba(10,12,8,.65);padding:0 9px;white-space:nowrap}

#hud [data-h="wp"]{right:18px;bottom:18px;text-align:right}

#hud [data-h="torch"]{font-size:15px;letter-spacing:.12em;color:var(--amber);white-space:nowrap}
#hud [data-h="board"]{left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(520px,92vw);max-width:94vw;max-height:80vh;overflow:hidden;background:rgba(10,12,8,.88);border:1px solid var(--line);padding:14px 18px;text-shadow:none}

/* ---------- loading screen (driven by main.js from the engine's 'loading' event; bar and sheen are compositor animations, they move even while the page works) ---------- */
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:#0b0d09 radial-gradient(120% 90% at 18% 112%,rgba(232,166,40,.14),transparent 62%);opacity:1;transition:opacity .28s ease-out;user-select:none;-webkit-user-select:none}

.ld-in{position:relative;width:min(940px,100%);padding:clamp(18px,6vw,72px);display:grid;gap:10px}

.fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;padding:6vw;background:linear-gradient(90deg,rgba(10,12,8,.96) 0,rgba(10,12,8,.82) 55%,rgba(10,12,8,.5) 100%)}
