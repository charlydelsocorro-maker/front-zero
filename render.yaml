services:
  - type: web
    name: front-zero
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix server
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FZ_TRUST_PROXY
        value: "1"
      - key: FZ_ORIGINS
        value: "https://charlydelsocorro-maker.github.io"
